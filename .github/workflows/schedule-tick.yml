# The scheduler's heartbeat.
#
# Vercel's Hobby plan runs a cron job once a day, which is fine as a safety net
# and useless as a scheduler - "the shop goes up at 18:00" has to mean 18:00,
# not some time before tomorrow morning. GitHub Actions schedules every five
# minutes for free, so it drives the heartbeat and the Vercel cron in
# vercel.json stays as the backstop for when Actions is having a bad day.
#
# The tick is idempotent: it publishes whatever should be live at this instant
# and nothing else, so an extra run costs one API call and changes nothing.
#
# Setup, once:
#   1. Repository -> Settings -> Secrets and variables -> Actions
#   2. Add BACK_OFFICE_URL, e.g. https://cliff-heroes-back-office.vercel.app
#   3. Add CRON_SECRET with the same value set in the Vercel project's
#      environment variables. Without it the endpoint is unguarded - harmless,
#      because a tick can only apply a window whose start time has passed, but
#      worth closing anyway.

name: Scheduler heartbeat

on:
  schedule:
    # GitHub queues scheduled workflows and can run them several minutes late
    # under load. Five minutes is the shortest interval it accepts.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  # Never let a slow tick overlap the next one. Two ticks publishing the same
  # window at once would be harmless but confusing in the audit log.
  group: scheduler-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire the tick
        env:
          BASE: ${{ secrets.BACK_OFFICE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE" ]; then
            echo "BACK_OFFICE_URL is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          body=$(mktemp)
          status=$(curl --silent --show-error --max-time 120 \
            --output "$body" --write-out '%{http_code}' \
            -H "Authorization: Bearer $SECRET" \
            -X POST "$BASE/api/schedule/tick")

          echo "HTTP $status"
          cat "$body"
          echo

          # A non-2xx is a real failure worth an email: it means scheduled
          # changes are not going live.
          case "$status" in
            2*) exit 0 ;;
            *) exit 1 ;;
          esac
