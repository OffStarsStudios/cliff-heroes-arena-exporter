# The scheduler's backstop heartbeat.
#
# NOT the primary. This was tried as the primary and is not good enough: GitHub
# runs `schedule` events on a best-effort basis and deprioritises frequent ones,
# so a `*/5` cron here arrives ten to thirty minutes late as a matter of course
# and sometimes not at all. A window booked for 18:00 has to open at 18:00, and
# this cannot promise that.
#
# The primary heartbeat is an external pinger (cron-job.org or equivalent)
# hitting POST /api/schedule/tick every five minutes with the same bearer token.
# See the Scheduling section of the README.
#
# This workflow stays because it is free, needs no third party, and catches up
# whatever the pinger missed while it was down. Every fifteen minutes is the
# right cadence for that: often enough to bound the damage, rare enough that its
# unreliability is not mistaken for the real thing.
#
# The tick is idempotent - it publishes whatever should be live at this instant
# and nothing else - so two heartbeats racing is not a problem, and an extra run
# costs one API call and changes nothing.
#
# Setup, once:
#   1. Repository -> Settings -> Secrets and variables -> Actions
#   2. Add BACK_OFFICE_URL, the deployment origin with no trailing slash,
#      e.g. https://cliff-heroes-arena-exporter.vercel.app
#   3. Add CRON_SECRET with the same value set in the Vercel project's
#      environment variables. Without it the endpoint is unguarded - harmless,
#      because a tick can only apply a window whose start time has passed, but
#      worth closing anyway.

name: Scheduler heartbeat

on:
  schedule:
    # Deliberately not */5. See the note above: GitHub cannot keep that promise,
    # and a heartbeat that is late in an unpredictable way is worse than one
    # that is openly a backstop.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # Never let a slow tick overlap the next one. Two ticks publishing the same
  # window at once would be harmless but confusing in the audit log.
  group: scheduler-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire the tick
        env:
          BASE: ${{ secrets.BACK_OFFICE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE" ]; then
            echo "BACK_OFFICE_URL is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          body=$(mktemp)
          status=$(curl --silent --show-error --max-time 120 \
            --output "$body" --write-out '%{http_code}' \
            -H "Authorization: Bearer $SECRET" \
            -X POST "$BASE/api/schedule/tick")

          echo "HTTP $status"
          cat "$body"
          echo

          # A non-2xx is a real failure worth an email: it means scheduled
          # changes are not going live.
          case "$status" in
            2*) exit 0 ;;
            *) exit 1 ;;
          esac
